{% extends 'base.html' %}

{% block content %}
<div style="max-width: 500px; margin: 4rem auto; text-align: center;">
    <div class="card" style="border-top: 4px solid #ef4444;">
        <h2 style="color: #ef4444; margin-top: 0;">Something went wrong</h2>
        <p style="color: #4b5563; font-size: 1.1rem; line-height: 1.6;">
            {{ message|default:"An unexpected error occurred." }}
        </p>
        <div style="margin-top: 2rem;">
            <a href="{% url 'dashboard' %}" class="btn btn-outline">Return to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
