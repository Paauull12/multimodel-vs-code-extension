{% extends 'base.html' %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto;">
    <a href="{% url 'dashboard' %}" style="text-decoration: none; color: #6b7280; font-size: 0.9rem; margin-bottom: 1rem; display: inline-block;">&larr; Back to Dashboard</a>
    
    <div class="card">
        <h2 style="margin-top: 0;">Upload Document</h2>
        <p style="color: #6b7280; margin-bottom: 1.5rem; font-size: 0.9rem;">
            The file will be embedded using <code>all-MiniLM-L6-v2</code> and stored in your vector database.
        </p>
        
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <label for="name">Document Name</label>
            <input type="text" name="name" id="name" placeholder="e.g. Q4 Financial Report" required>
            
            <label for="file">File (Text only for now)</label>
            <div style="border: 2px dashed #d1d5db; padding: 2rem; text-align: center; border-radius: 6px; margin-bottom: 1.5rem; background: #f9fafb;">
                <input type="file" name="file" id="file" required style="border: none; background: transparent; width: auto;">
                <div style="font-size: 0.8rem; color: #9ca3af; margin-top: 0.5rem;">.txt files supported</div>
            </div>

            <div style="display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Upload & Embed</button>
                <a href="{% url 'dashboard' %}" class="btn btn-outline" style="flex: 1; text-align: center;">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
